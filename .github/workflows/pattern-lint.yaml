name: pattern-lint

# The corpus-policy rules distilled from review findings (method order, sidecar
# conventions, formatting) — everything that is a lesson about THIS corpus
# rather than about abap2UI5 views in general, which belongs in the linter.

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pattern-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the gate's established name and stays snake_case (AGENTS §6):
  # it is what branch protection tracks, so moving the gate out of checks.yaml
  # is invisible to it.
  pattern_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/pattern-lint.mjs
