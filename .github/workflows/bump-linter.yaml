# The linter comes from npm as `@abap2ui5/linter`, and package-lock.json is
# what actually decides which version the view gates run: `npm ci` reads the
# lock, so a new release reaches this corpus only when the lock moves. This
# workflow moves it weekly to the latest published version, runs the gate that
# consumes the linter, and opens a PR.
#
# It tracks `latest` rather than staying inside the declared range, because the
# range is the thing being maintained here: the previous version of this
# workflow tracked the linter's main branch unconditionally, so following every
# published release — major ones included — is the same policy expressed
# against a registry instead of a branch. The full strict view gates run before
# the PR exists, which is what makes that safe: a rule regression over the 622
# ports fails this workflow instead of landing on main.
name: bump-linter

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays 06:23 UTC — right after the extension's 06:17 bump
  workflow_dispatch:

# one run at a time: a manual dispatch that overlaps the weekly cron would
# open two pull requests for the same bump
concurrency:
  group: bump-linter

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Move @abap2ui5/linter to the latest published version
      id: pin
      run: |
        set -euo pipefail
        # Resolved first and checked, because `npm view` prints nothing and
        # still exits 0 when a package has no `latest` dist-tag - installing
        # `@abap2ui5/linter@` would then resolve to whatever npm felt like.
        # Fail here instead. (web-abap2UI5's build stamp had exactly this hole
        # with `git ls-remote` and went blind for as long as it was there.)
        VERSION=$(npm view @abap2ui5/linter version)
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        # Writes the range in package.json AND the exact version in the lock.
        # Both matter: the range is what a fresh install reads, the lock is
        # what `npm ci` reads, and the gates below run on the lock.
        npm install --save-dev "@abap2ui5/linter@$VERSION"
        # package.json alone is not the signal it used to be: a release inside
        # the declared range moves only package-lock.json, and that is exactly
        # the bump this corpus needs to see.
        if git diff --quiet package.json package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # the corpus gate that consumes the linter — a rule regression over the
    # 622 ports surfaces here, in the PR run, not on main
    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      run: node scripts/view-gates.mjs --strict

    - if: steps.pin.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-linter
        title: 'chore: bump @abap2ui5/linter'
        commit-message: 'chore: bump @abap2ui5/linter to ${{ steps.pin.outputs.version }}'
        body: |
          Weekly move of `@abap2ui5/linter` to the latest version on npm
          (${{ steps.pin.outputs.version }}). The strict view gates over the
          full corpus ran on it in the workflow that opened this PR.

          Note: the VS Code extension consumes the same linter — merge both
          bumps in the same week to keep the two consumers on one linter
          state.
        add-paths: |
          package.json
          package-lock.json
        delete-branch: true
