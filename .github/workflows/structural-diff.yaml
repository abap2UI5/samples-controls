name: structural-diff

# Every port against the original it rebuilds, controls and binding values
# included. An undeclared difference fails: a deviation from the sample is
# allowed, silently drifting away from it is not.

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: structural-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural_diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/structural-diff.mjs --strict
