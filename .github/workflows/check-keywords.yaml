name: check-keywords

# Every port says what it is about, in a `" @keywords` line derived from the
# sidecar's `entity`, the class DESCRIPT and the controls the port builds.
# Nothing about a missing line is broken - the port compiles, runs and appears
# in the overview - which is exactly why 431 of them went without one for the
# repository's whole life. The only symptom is that nobody looking for it
# arrives.
#
# The line is generated and committed, so this checks it is still what the
# sources imply: rename an entity or add a control, and the line moves with it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-keywords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/generate-keywords.mjs --check
