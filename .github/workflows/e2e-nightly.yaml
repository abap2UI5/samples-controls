name: e2e-nightly

# Runs every port as the REAL app (transpiled abap2UI5 backend + headless
# Chromium, scripts/e2e-build.mjs + e2e-smoke.mjs) — the heavy gate that the
# fast PR gates deliberately skip (multi-minute transpile + browser).
# Nightly so LIVE_TEST-class regressions surface within a day instead of at
# the next release: every INTERACTIONS entry that stays green here is a
# LIVE_TEST candidate for closure (STATUS.md open findings).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly, 02:30 UTC

# `issues: write` is here again, and this time the API will honour it: issues
# were DISABLED on this repository until 2026-08-27, which is why the original
# `gh issue create` channel could never land. The step summary is still written
# unconditionally and needs no permission; the issue is the TRACKED half, and
# is best-effort on top of it — it must never be the reason the job is red.
permissions:
  contents: read
  issues: write

# Workflow level, so it bounds RUNS and not the four shards of one run: every
# matrix job belongs to the same run and shares this group without queueing
# behind its siblings.
concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # SHARDED since 2026-08-28. The corpus ran in ONE job at ~19 min transpile
    # + ~4 s per port, which had reached 68 minutes of the 90-minute budget and
    # grows with every batch — the same budget that had already been re-sized
    # once after 2026-08-02/04/06/07/10/12 all died mid-smoke as "cancelled",
    # i.e. the badge went grey for a timeout rather than for a regression.
    # Four shards halve the wall clock and, more usefully, isolate a failure:
    # one flaky port now reddens one shard instead of the whole nightly, and
    # the shard is reproducible with the same flag.
    #
    # Each shard rebuilds the backend rather than downloading one artifact.
    # That repeats the ~19-minute transpile four times, which is the cost
    # deliberately paid: the build's product is `.abap2UI5/node/output` PLUS
    # that checkout's node_modules and its express shim, so the artifact would
    # be the whole framework tree — slower to move than to rebuild, and a
    # cache key nobody would notice going stale. Revisit if the transpile
    # grows past the smoke.
    strategy:
      fail-fast: false        # one red shard must not hide the other three
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 60
    steps:
    - name: Checkout samples-controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install samples-controls dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Clone abap2UI5 (transpiler + express runtime)
      run: |
        git clone --depth 1 https://github.com/abap2UI5/abap2UI5.git .abap2UI5
        cd .abap2UI5 && npm ci

    - name: Build the transpiled backend (framework + all ports)
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: npm run e2e:build

    # The gate the whole workflow exists to run, and it stays able to fail: no
    # continue-on-error, no relaxed flags, no `|| true`. A regressed port is the
    # CORRECT reason for this job to be red. All that changes is that the report
    # step below now runs afterwards and can say WHICH ports.
    #
    # `tee` so the verdict can name them instead of only linking the run.
    # `set -o pipefail` is load-bearing: the implicit default shell is
    # `bash -e {0}` WITHOUT pipefail, so without it `tee`'s exit code (always 0)
    # masks the smoke's and this gate reports green while failing. The log lives
    # in RUNNER_TEMP, outside the work tree.
    - name: Run this shard's ports as the real app
      id: smoke
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: |
        set -o pipefail
        node scripts/e2e-smoke.mjs --strict --shard ${{ matrix.shard }}/4 2>&1 | tee "$RUNNER_TEMP/e2e-smoke.log"

    # A red nightly is a regression in a LIVE_TEST-class wire — it must reach
    # someone, not sit in the Actions tab until the next release.
    #
    # The primary channel is $GITHUB_STEP_SUMMARY, and for a long time it was
    # the ONLY one that worked: issues were disabled here until 2026-08-27
    # (`"has_issues": false`), so the `gh issue create` this step used to
    # attempt could never land. What actually happened every night until then
    # is in the run log of 33074599814:
    #
    #   ##[warning]could not reach the issue tracker (the
    #   'abap2UI5/samples-controls' repository has disabled issues )
    #
    # — i.e. `gh issue list` failed FIRST and the guard swallowed it, so
    # `gh issue create` was never even reached. The comment that used to stand
    # here claimed the opposite ("failed a second time in `gh issue create`")
    # and quoted an error naming 'abap2UI5/ai-demokit', a different repository:
    # it was imported prose, not an observation of this repo. The conclusion
    # was right, the mechanism it described was not.
    #
    # What reaches a human is the RED RUN ITSELF: GitHub notifies the account
    # that owns a scheduled workflow when its run fails, and that notification
    # links to this page. That channel was never broken — 8 of the 9 nightlies
    # since 2026-08-18 were red and delivered. What was broken is that the
    # report said "every FAIL line in the run log" and then printed no FAIL
    # lines, so acting on it meant opening the run and scrolling 623 `pass`
    # lines to find the two that said FAIL. The summary now carries them.
    #
    # A TRACKED channel (one item per breakage, closable) needed issues
    # enabled in the repository settings. They were turned on 2026-08-27, so
    # the step below files one — but the summary stays the primary report,
    # because it is the thing the red-run notification already links to.
    #
    # `!cancelled()` rather than `always()`: a run cut off by the 90-minute
    # timeout has no verdict to carry and a runner being torn down under it.
    # (The budget is not tight — 33074599814 used 68 minutes of the 90.)
    # `${{ }}` around it is mandatory: a bare `if: !cancelled()` is invalid
    # YAML, because `!` opens a tag.
    - name: Report the nightly verdict
      if: ${{ !cancelled() }}
      env:
        SMOKE: ${{ steps.smoke.outcome }}
        SHARD: ${{ matrix.shard }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/e2e-smoke.log"

        # THREE verdicts, not two. `outcome` is EMPTY when the step never ran
        # at all — the build died before the smoke — and an `if success/else`
        # would render that case as green, which is the exact failure this
        # report exists to stop.
        case "$SMOKE" in
          success)
            heading="e2e-nightly shard $SHARD/4 is green"
            verdict='Every port booted as the real app and every interaction wire held.'
            ;;
          failure)
            heading="e2e-nightly shard $SHARD/4 is RED — a live wire regressed"
            verdict='**The strict e2e smoke FAILED.** Every `FAIL` line below is a port whose live wire regressed — or a harness effect, see `.claude/skills/e2e-debugging`. Fix the port or record it in STATUS.md: a nightly that stays red for days stops being read.'
            ;;
          *)
            heading="e2e-nightly shard $SHARD/4 is RED — the smoke never ran"
            verdict='**The e2e smoke did not run.** `npm ci`, the Playwright install, the abap2UI5 clone or `npm run e2e:build` died first, so nothing about the ports is known yet — but a backend that no longer builds against the pinned framework is itself the finding.'
            ;;
        esac

        # every printf format is SINGLE-quoted: the text is full of backticks
        # and none of them may reach the shell as a command substitution
        {
          printf '## %s\n\n' "$heading"
          printf '%s\n\n' "$verdict"
          printf 'Run: %s\n' "$RUN_URL"
          if [ -s "$log" ]; then
            printf '\n```\n'
            # `|| true` because grep exits 1 on no match, and `set -o pipefail`
            # is in force from `set -euo pipefail` above — a green run legitimately
            # has no FAIL line and must not fail the report.
            grep -E '^(FAIL|e2e-smoke:)' "$log" | tail -40 || true
            printf '```\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # The TRACKED half: one open issue while the nightly is red, closed when it
    # goes green again. Deliberately best-effort — `continue-on-error` and a
    # `|| true` on every `gh` call — because a tracker that is unreachable
    # (disabled again, a token scope change, an outage) must never be what
    # turns a GREEN nightly red. The summary above has already been written by
    # the time this runs, so nothing is lost if this step does nothing.
    #
    # ONE issue, not one per night: the title is the search key, so a nightly
    # that is red for a week updates the same item instead of filing seven.
    - name: File or close the tracking issue
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        SMOKE: ${{ steps.smoke.outcome }}
        SHARD: ${{ matrix.shard }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        # ONE ISSUE PER SHARD. A single title across the matrix would have four
        # jobs racing on the same item, and the green ones would close what the
        # red one had just filed.
        title="e2e-nightly shard $SHARD/4 is red"
        existing="$(gh issue list --state open --search "$title in:title" \
                      --json number --jq '.[0].number' 2>/dev/null || true)"

        if [ "$SMOKE" = "success" ]; then
          # Close only what this workflow opened, and say why in the thread
          # rather than closing silently.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Green again as of $RUN_URL — closing." || true
            gh issue close "$existing" || true
          fi
          exit 0
        fi

        log="$RUNNER_TEMP/e2e-smoke.log"
        fails="$( [ -s "$log" ] && grep -E '^(FAIL|e2e-smoke:)' "$log" | tail -40 || true )"
        body="$(printf '%s\n\n```\n%s\n```\n' "The nightly is red: $RUN_URL" "$fails")"

        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "$body" || true
        else
          gh issue create --title "$title" --body "$body" || true
        fi
