# The framework the reproducible builds run against is fixed at the commit in
# A2UI5_PIN (node-setup and the web/Pages build check it out; the nightly e2e
# deliberately stays on main tip as the upstream canary). This workflow moves
# the pin: once a week it resolves abap2UI5 main, rebuilds the full backend at
# that commit, runs the e2e smoke over every port, and opens a PR — so a
# breaking framework change arrives as a red bump PR instead of a broken
# Pages deploy.
#
# The RED half of that promise is the whole point, so the pull request opens on
# the smoke's verdict rather than only on its success: create-pull-request is
# guarded by `!cancelled()`, the smoke step itself is never softened (no
# continue-on-error, no weakened flags — a broken corpus at the new pin still
# reddens this job), and the PR title, the PR body and the step summary all
# carry the verdict plus every FAIL line. Guarding the PR on
# `changed == 'true'` alone — as this file did until 2026-08-27 — inverted the
# promise exactly: a failing smoke aborted the job and opened NOTHING, which is
# the one case the header exists to cover. Three runs died that way
# (2026-08-25 twice, 2026-08-27, each "623 app(s), 1 failing"): no PR, no
# issue, nobody told, and A2UI5_PIN sat at bf92a79c while abap2UI5 main moved
# 61 commits.
#
# The failure channel here is the pull request plus $GITHUB_STEP_SUMMARY, and
# deliberately NOT the `gh issue create` that e2e-nightly.yaml uses: issues are
# DISABLED on this repository, which is why every red nightly failed a second
# time inside that step and reached nobody (the comment there says so). A pull
# request is the one notification channel this repo actually has open — and
# unlike an issue it carries the diff that caused the breakage and blocks
# itself on its own red checks.
name: bump-a2ui5

on:
  schedule:
    - cron: '11 5 * * 2'   # Tuesdays 05:11 UTC, off the full-hour load spikes
  workflow_dispatch:

# one run at a time: a manual dispatch that overlaps the weekly cron would
# open two pull requests for the same bump
concurrency:
  group: bump-a2ui5

# No `issues: write`: see the header — the report is the PR and the step
# summary, so this workflow never touches the (disabled) issue tracker.
permissions:
  contents: write
  pull-requests: write

jobs:
  bump-a2ui5:
    runs-on: ubuntu-latest
    # same full build + smoke the nightly runs, so the same budget (see
    # e2e-nightly.yaml) plus the browser install
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    # The abaplint configs resolve the framework's MAIN branch, not this SHA -
    # abaplint's "branch" key feeds `git clone --branch` and takes a tag or a
    # branch, never a commit. Since 2026-08-31 they no longer track a release
    # tag: framework releases are monthly snapshots and never gate a corpus
    # merge (scripts/check-pins.mjs carries the policy), so only the commit
    # pin moves here.
    - name: Resolve abap2UI5 main and move the pin
      id: pin
      run: |
        set -euo pipefail
        # --exit-code under pipefail: `git ls-remote` prints nothing and still
        # exits 0 for a ref that does not match, so a renamed default branch
        # upstream would resolve to an EMPTY sha and this step would move the
        # pin to nothing. Fail here instead. (web-abap2UI5's build stamp had
        # exactly this hole and went blind for as long as it was there.)
        SHA=$(git ls-remote --exit-code https://github.com/abap2UI5/abap2UI5 refs/heads/main | cut -f1)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        if [ "$SHA" != "$(cat A2UI5_PIN)" ]; then
          echo "$SHA" > A2UI5_PIN
          # ... and the PROSE that names the pin, in the same commit. Moving
          # A2UI5_PIN alone left AGENTS.md citing the previous commit, which is
          # `check_pins` policy 6 - so every bump pull request was born red on
          # a gate about the very thing this step just did. It reached `main`
          # that way once (2026-09-09, the bump to 9fd5c20b): the PR's own
          # gate set sat unapproved, so nothing said so before the merge.
          # check-pins.mjs --fix owns the patterns, this step does not carry a
          # regex of its own, and it rewrites only present-tense claims - a
          # sentence about a state that has passed stays history. It needs no
          # node_modules (it reads files, and says so when the linter metadata
          # is unreadable), so it runs here, before `npm ci`.
          #
          # `|| true`, and only here: --fix still CHECKS every other policy and
          # exits 1 on any of them, and under `set -e` that would kill this
          # step - leaving `changed` unset, which the comment below explains
          # the run reads as broken rather than as a no-op. The fix is
          # best-effort; the check is the check_pins job on the pull request,
          # which reports the same finding where it belongs.
          node scripts/check-pins.mjs --fix || true
        fi
        # Every step below is gated on this, and it is written only once the
        # resolve has succeeded: a run that dies in the resolve leaves it
        # UNSET, so no `!cancelled()` step below can mistake a broken run for a
        # no-op one, and a genuine no-op week still opens nothing.
        if git diff --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # the proof: full build + smoke at the new pin, exactly what node-setup
    # gives a user and what deploy-web will ship.
    #
    # `npm ci` must come FIRST. Without it there is no local playwright, so
    # `npx` fetches the CURRENT release into a temp prefix and installs THAT
    # version's browser build; node-setup then runs its own `npm ci`, which
    # puts the pinned playwright in place, and the smoke asks for a browser
    # build that was never downloaded. That is exactly how the only bump-a2ui5
    # run so far died (2026-08-11: "Executable doesn't exist at
    # …/chromium_headless_shell-1228" right after installing build 1234).
    - if: steps.pin.outputs.changed == 'true'
      run: npm ci
    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      run: node scripts/node-setup.mjs

    # The gate this whole workflow exists to run, and it stays able to fail:
    # no continue-on-error, no relaxed flags, no `|| true`. A red smoke at the
    # new pin is the CORRECT outcome and it reddens this job. All that changed
    # is that the steps after it still run.
    #
    # `tee` so the PR body can name the ports that broke instead of only
    # linking the run. `set -o pipefail` is load-bearing: the implicit default
    # shell is `bash -e {0}` WITHOUT pipefail, so without it `tee`'s exit code
    # would mask the smoke's and this gate would report green while failing.
    # The log lives in RUNNER_TEMP, outside the work tree, where nothing
    # create-pull-request does to that tree can reach it.
    - name: Run the strict e2e smoke at the new pin
      id: smoke
      if: steps.pin.outputs.changed == 'true'
      run: |
        set -o pipefail
        node scripts/e2e-smoke.mjs --strict 2>&1 | tee "$RUNNER_TEMP/e2e-smoke.log"

    # Composes what the PR will say, and writes the same verdict to the step
    # summary so the run stays readable even if opening the PR itself fails.
    #
    # `!cancelled()` rather than `always()`: a run cut off by the 90-minute
    # timeout — the shape that turned the nightly grey six times in August —
    # has no verdict to carry and a runner being torn down under it, so it
    # opens nothing. Everything else, pass or fail, produces a PR.
    - name: Compose the bump PR title and body
      id: report
      if: ${{ !cancelled() && steps.pin.outputs.changed == 'true' }}
      env:
        # through env, not inline `${{ }}` in the script: SHA and TAG are
        # `git ls-remote` output, and expressions are pasted into the shell
        # before it parses anything.
        SMOKE: ${{ steps.smoke.outcome }}
        SHA: ${{ steps.pin.outputs.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/e2e-smoke.log"
        # `outcome` is empty when the step never ran at all, i.e. the build
        # died before the smoke - a third verdict, not a green one.
        case "$SMOKE" in
          success)
            title='chore: bump the pinned abap2UI5 framework commit'
            verdict='The full backend build and the strict e2e smoke over all ports ran green at the new pin. This is a routine bump.'
            ;;
          failure)
            title='chore: bump abap2UI5 — THE E2E SMOKE IS RED AT THE NEW PIN'
            verdict='**The strict e2e smoke FAILED at the new pin.** Read this PR as the report of a breaking framework change — here is the change, and below is what it broke — not as a routine bump. Do not merge it to clear the badge: either the ports below get their fix in this same PR, or the pin waits for an upstream fix and this PR is closed.'
            ;;
          *)
            title='chore: bump abap2UI5 — THE BUILD IS RED AT THE NEW PIN'
            verdict='**The e2e smoke never ran.** `npm ci`, the Playwright install or `node scripts/node-setup.mjs` failed at the new pin, so nothing about the ports is known yet — but a backend that no longer builds against main is itself the finding.'
            ;;
        esac
        echo "title=$title" >> "$GITHUB_OUTPUT"

        # every printf format is SINGLE-quoted: the body is full of backticks
        # and none of them may reach the shell as a command substitution
        {
          printf 'Weekly re-resolve of `A2UI5_PIN` against abap2UI5 main (`%s`) —\n' "$SHA"
          printf 'what node-setup, the Pages build and the e2e smoke run against.\n'
          printf 'The abaplint configs resolve main directly (unpinned), and the\n'
          printf 'nightly e2e keeps testing main tip as the canary.\n\n'
          printf '## The verdict at the new pin\n\n'
          printf '%s\n\n' "$verdict"
          printf 'Run: %s\n' "$RUN_URL"
          if [ -s "$log" ]; then
            printf '\n```\n'
            grep -E '^(FAIL|e2e-smoke:)' "$log" | tail -40 || true
            printf '```\n\n'
            printf 'Every FAIL line is a port whose live wire broke against the new\n'
            printf 'framework commit — or a harness effect, see `.claude/skills/e2e-debugging`.\n'
          fi
        } > "$RUNNER_TEMP/pr-body.md"

        # multi-line step output, the documented delimiter form. `body-path:`
        # would read better, but this workflow's create-pull-request is pinned
        # by SHA and `body:` is the input it is already known to accept.
        delim="PR_BODY_EOF_${RANDOM}${RANDOM}"
        {
          echo "body<<$delim"
          cat "$RUNNER_TEMP/pr-body.md"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

        {
          printf '## %s\n\n' "$title"
          cat "$RUNNER_TEMP/pr-body.md"
        } >> "$GITHUB_STEP_SUMMARY"

    # `!cancelled()` — not `always()`, and emphatically not `success()`: a bump
    # that breaks the corpus is precisely what this workflow exists to surface,
    # and the diff plus the FAIL lines in the body are what make it actionable.
    # This step succeeding does not un-fail the smoke, so the job stays red and
    # so does the PR.
    - name: Open (or update) the bump PR, red or green
      if: ${{ !cancelled() && steps.pin.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-a2ui5
        # the fallbacks matter: if composing the report is what died, the pin
        # move must still reach a human rather than vanish with it. Both values
        # are DOUBLE-quoted because the fallback strings contain `: `, which an
        # unquoted plain scalar reads as a mapping.
        title: "${{ steps.report.outputs.title || 'chore: bump the pinned abap2UI5 framework commit' }}"
        body: "${{ steps.report.outputs.body || format('The bump PR body could not be composed. Read the run instead - {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
        commit-message: 'chore: bump A2UI5_PIN to abap2UI5/abap2UI5@${{ steps.pin.outputs.sha }}'
        add-paths: |
          A2UI5_PIN
          abaplint.jsonc
          .github/abaplint
        delete-branch: true

    # The one remaining path that can open no PR: the job died before it knew
    # whether there was a bump at all, i.e. in one of the two network resolves,
    # which leaves `changed` unset. Nothing else would say so, so it lands in
    # the step summary rather than only in the job log.
    - name: Report a failure no PR can carry
      if: ${{ failure() && steps.pin.outputs.changed != 'true' }}
      run: |
        {
          echo "## bump-a2ui5 failed before it could open a PR"
          echo
          echo "The run failed while resolving the abap2UI5 references, so it never"
          echo "reached the point where a bump PR would carry the news. A2UI5_PIN is"
          echo "unchanged. Read the job log."
        } >> "$GITHUB_STEP_SUMMARY"
