name: generate-result

# Regenerates the four generated artefacts (AGENTS §7): the README.md coverage
# summary, api.md, the STATUS.md state block and the in-system overview app —
# every UI5 demo kit sample per focused library, marked with whether an
# abap2UI5 port exists. The sample universe snapshot ui5/universe.json is
# REFRESHED from a shallow OpenUI5 checkout (sample dirs + api.json via
# `grunt jsdoc`); the ported set is read from the meta/ sidecars.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-result
  cancel-in-progress: false

jobs:
  generate-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Shallow clone OpenUI5 (sample universe)
      run: git clone --depth 1 https://github.com/SAP/openui5.git openui5

    # Control metadata source. Only sap.m's api.json is built here — the other
    # FOCUS_LIBS (scripts/generate-coverage.mjs) get their Since/deprecation
    # from ui5/properties.json (regenerated below). The jsdoc task may exit non-zero on
    # cross-library type warnings while still writing a valid api.json, so we
    # tolerate the exit code and assert the artifact exists instead.
    # `npm ci` is OpenUI5's install, not ours: when their committed
    # package-lock.json drifts from their package.json it hard-fails with
    # EUSAGE, which is nothing this repo can fix. That took this workflow down
    # on 2026-07-27 (js-yaml/argparse/sprintf-js missing from the lock); their
    # lock was repaired upstream on 2026-07-28, so the fallback below is
    # hardening against the next drift rather than a live fix. `npm install`
    # resolves the tree from package.json — we only need their jsdoc
    # toolchain, not a reproducible install.
    - name: Build control metadata (api.json) for focused libraries
      working-directory: openui5
      run: |
        npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        npx grunt jsdoc:library-sap.m || true
        test -f target/openui5-sdk/test-resources/sap/m/designtime/api.json

    # Installs @abap2ui5/linter, which brings the metadata generator used below.
    - name: Install this repo's dependencies
      run: npm ci --no-audit --no-fund

    # The 1.71 property snapshot. Built by the LINTER's generator - the same one
    # that produces the linter's own data/properties.json - rather than by a
    # second parser living here, which is what scripts/generate-properties.mjs
    # used to be. Two parsers over two checkouts had already drifted: the local
    # one attributed a file-level `@deprecated` JSDoc block sitting on a local
    # variable to the CONTROL, marking sap.f.DynamicPageTitle and
    # sap.f.semantic.SemanticPage deprecated when neither class doc says so.
    #
    # It runs against THIS workflow's OpenUI5 checkout, not the linter's pinned
    # @openui5 packages, because the snapshot has to cover the same release the
    # sample universe is built from (`ui5/universe.json`.release). A snapshot
    # older than the universe loses the @since of controls introduced in
    # between, and scopeOf then reads them as in scope - sap.f.HeroBanner
    # (@1.152) is the current example. One generator, two invocations, each at
    # the version its own consumer needs.
    - name: Refresh the 1.71 property snapshot
      env:
        OPENUI5_DIR: ./openui5
      run: |
        GEN=node_modules/@abap2ui5/linter/scripts/generate-metadata.mjs
        test -f "$GEN" || {
          echo "::error::$GEN is missing — the installed @abap2ui5/linter predates the"
          echo "::error::release that publishes the generator. Bump it in package.json."
          exit 1
        }
        node "$GEN" --out ui5/properties.json

    # The demo kit's own sentence per sample - the source `npm run summary`
    # writes onto the classes and `npm run check:summary` holds them to. It is
    # the THIRD snapshot taken from this checkout and was the only one with no
    # refresh path at all: it stood at OpenUI5 e50e7cc6 / 1.151.0-SNAPSHOT
    # while the universe beside it moved to 1.152.0. A sample the universe
    # gains but the descriptions do not is a HARD failure of check:summary
    # (a port that matches no source fails rather than being skipped, which is
    # the point), so without this step the repository could reach a state no
    # scheduled job could repair. check-pins rule 4 now holds all three
    # snapshots to the same release line.
    - name: Refresh the demo kit descriptions
      run: node scripts/fetch-descriptions.mjs --openui5 ./openui5

    - name: Regenerate coverage (README + api.md)
      env:
        OPENUI5_DIR: ./openui5
        APIJSON_ROOT: ./openui5/target/openui5-sdk/test-resources
        REF: main
      run: node scripts/generate-coverage.mjs

    # The classes' `" @summary` lines come FROM the snapshot refreshed above,
    # so they move with it or check:summary fails on this workflow's own PR.
    # It stays a diff somebody reads - that is what the snapshot is for - but
    # the diff now arrives complete instead of as a red check.
    # It runs BEFORE the three generators below: all three read the class
    # `" @summary` line back out.
    - name: Rewrite the class summary lines from the refreshed snapshot
      run: node scripts/generate-summary.mjs

    - name: Regenerate the in-system overview app
      run: node scripts/generate-overview.mjs

    - name: Regenerate the STATUS.md state block
      run: node scripts/generate-status.mjs

    # SAMPLES.md reads the ports, the meta/ sidecars AND ui5/descriptions.json;
    # catalogue.json carries `ui5Snapshot: universe.release` plus every port's
    # summary. Both are therefore stale the moment this workflow runs, and
    # meta-valid.yaml regenerates and `git diff --exit-code`s them - so leaving
    # them out opened a pull request that failed its own meta_valid gate.
    - name: Regenerate SAMPLES.md
      run: node scripts/generate-samples-md.mjs

    - name: Regenerate catalogue.json
      run: node scripts/generate-catalogue.mjs

    - name: Drop OpenUI5 checkout
      run: rm -rf openui5

    - name: Stamp last generated date into README
      run: |
        STAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        sed -i "s|<!-- last-run -->.*<!-- /last-run -->|<!-- last-run -->$STAMP<!-- /last-run -->|" README.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        # Every file the steps above write, or the PR opens against its own
        # freshness gates. catalogue.json carries `ui5Snapshot:
        # universe.release` (generate-catalogue.mjs), so refreshing the universe
        # ALWAYS makes it stale; SAMPLES.md and every port's `" @summary` line
        # read ui5/descriptions.json, which this workflow now refreshes. Both
        # used to be absent and both were reachable by the gates that run on
        # this workflow's own pull request.
        add-paths: |
          api.md
          README.md
          STATUS.md
          SAMPLES.md
          catalogue.json
          ui5/universe.json
          ui5/properties.json
          ui5/descriptions.json
          src/**/*.clas.abap
          src/z2ui5_cl_smpc_app_000.clas.xml
        commit-message: Regenerate sample coverage
        author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        committer: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
        branch: generate-result/regenerate
        delete-branch: true
        title: Regenerate sample coverage
        body: Automated coverage regeneration from the latest OpenUI5 demo kit samples.
