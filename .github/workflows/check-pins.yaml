name: check-pins

# the abap2UI5 pin policy: A2UI5_PIN is a well-formed commit SHA and no
# abaplint config carries a stray/duplicate "branch" on the abap2UI5
# dependency (only abap_702.jsonc's "702" is allowlisted) — a silent
# second pin once pointed at a deleted branch (the journal, 2026-08-10)

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/check-pins.mjs
