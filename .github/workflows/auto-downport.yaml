name: auto-downport

# Rebuilds the 702 branch: downports the sources, lints with the 702 config
# and force-pushes the result to the 702 branch.

on:
  push:
    branches: [main]

concurrency:
  group: auto-downport
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-downport:
    if: github.repository == 'abap2UI5/samples-controls'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # same `npm run downport` as abap-702, same budget — see the note there.
    # Every run of this workflow had been dying in that step too, which is why
    # the 702 branch stopped being rebuilt.
    timeout-minutes: 60
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the scope step below diffs against the commit this push moved from
      with:
        fetch-depth: 0

    # The 702 branch is rebuilt from a full checkout every time, so a run that
    # is skipped leaves nothing half-done: the next merge that does reach the
    # ABAP rebuilds the branch from the main it finds. Same decision as the
    # abap-702 gate, same script - see the note there.
    - name: Does this push reach the ABAP?
      id: scope
      env:
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
          files=$(git diff --name-only "$BEFORE_SHA..HEAD")
        else
          files=''   # no range to work out - abap-scope.mjs answers "run"
        fi
        printf '%s\n' "$files" | node scripts/abap-scope.mjs | tee -a "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.scope.outputs.run == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'

    - run: npm ci
      if: steps.scope.outputs.run == 'true'
    - run: npm run downport
      if: steps.scope.outputs.run == 'true'
    - run: npx abaplint .github/abaplint/abap_702.jsonc
      if: steps.scope.outputs.run == 'true'

    - name: Commit and Push Changes
      if: steps.scope.outputs.run == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --staged --quiet || git commit -m "Downport changes"
        git push --force origin HEAD:702
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
