name: data-fidelity

# seeded asset values must match the archived sample mocks — catches the
# wrong-neighbour-copy class (apps 162/142/119) no other gate can see

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: data-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data_fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node scripts/data-fidelity.mjs
