name: meta-valid

# meta/ sidecars are the source of truth (schema + referential integrity),
# and the overview app is generated from them — fail on invalid sidecars
# or when a change forgot to regenerate the overview.
#
# EVERY generated artefact belongs in the regenerate + diff below, or it is a
# committed generated file with nothing watching it. SAMPLES.md was exactly
# that until 2026-08-18: `npm run gates` regenerated and diffed it, CI did
# neither, so a batch that skipped the local gate shipped a stale catalogue.
#
# This job used to run plain node with no install, because every generator here
# was dependency-free. generate-overview.mjs no longer is: it lays the class it
# writes out in the house layout, and that layout is now decided by the linter's
# chain-house-layout rule rather than by a second copy of the algorithm. So the
# install is the cost of having one implementation of the rule instead of two.

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meta-valid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta_valid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    # generate-overview.mjs imports @abap2ui5/linter (scripts/lib/format-chain.mjs)
    - run: npm ci --no-audit --no-fund
    - run: node scripts/validate-meta.mjs
    # the sidecars point at ui5/<lib>/<Sample>/, and a re-read is only worth
    # anything if that folder is complete - check-archive compares every file a
    # sample's manifest lists against what is on disk (app 145 was re-read
    # against an archive missing its controller's only dependency)
    - run: node scripts/check-archive.mjs
    - run: node scripts/generate-overview.mjs
    - run: node scripts/generate-coverage.mjs
    - run: node scripts/generate-status.mjs
    - run: node scripts/generate-samples-md.mjs
    - run: node scripts/generate-catalogue.mjs
    # catalogue-derived.json - what the linter knows about each port, published
    # for the playground's catalogue page to build its index from. Seven
    # seconds over 636 ports; the install above is already paid for.
    - run: node scripts/generate-derived.mjs --quiet
    - run: git diff --exit-code -- src README.md api.md STATUS.md SAMPLES.md catalogue.json catalogue-derived.json
