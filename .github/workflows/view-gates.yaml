name: view-gates

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

# view_gates writes the two README badges and publishes them to the badges
# branch, so its job - alone among the gates - raises contents: write.
permissions:
  contents: read

concurrency:
  group: view-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  view_gates:
    # abap2UI5-linter over every port: the view is reconstructed from the
    # builder calls, checked against the UI5 metadata (@since floor,
    # deprecation, unknown controls/members/values), checked for structural
    # defects (an aggregation inside an aggregation = a missing )->shut(), one
    # shut too many, a duplicate attribute) and rendered in a real headless
    # XMLView.create. scripts/view-gates.mjs adds the corpus policy on top:
    # POST_171 deviations, declared render_smoke skips.
    #
    # It also writes the two README badges, which is why this job needs
    # contents: write.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: node scripts/view-gates.mjs --strict

    # The SAPUI5-only collection (src/03) has no sidecars, so view-gates cannot
    # see it - by construction, which is right for the port machinery and wrong
    # for the view check. This is the view check for it: property gate only,
    # because the render gate serves OpenUI5 and these controls ship with
    # SAPUI5 alone. Settings and the reasoning: abap2ui5lint-collection.jsonc
    - run: npm run check:collection

    # The UI5 demo apps (src/04) are sidecar-less for the same structural
    # reason - a whole application is not a rebuild of one demo kit sample -
    # so view-gates cannot see them either. Same view check, with the 1.71
    # rules as ERRORS: these are OpenUI5 rebuilds that promise to run wherever
    # the src/01 ports run. Settings and the reasoning: abap2ui5lint-apps.jsonc
    - run: npm run check:apps

    # The generated overview app (src/z2ui5_cl_smpc_app_000) has no sidecar
    # either and is not in src/03, so until 2026-09-12 nothing judged what it
    # BUILDS against the 1.71 floor - its INFO button carried a 1.80 icon.
    # This is its version gate: one file, property gate on, the floor as an
    # error. Settings and the reasoning: abap2ui5lint-overview.jsonc
    - run: npm run check:overview

    # view-gates rewrote .github/badges/ with what the corpus now is, and
    # this step publishes those two files to the `badges` branch - an
    # orphan branch that holds nothing else and is what the README badges
    # read. Only on main: main is protected and github-actions[bot] cannot
    # bypass that, and the old way round - committing the badges onto the
    # pull request branch - started a second set of runs on that commit which
    # waited for a maintainer's approval and left the pull request blocked.
    # A pull request run publishes nothing; the run on main after the merge
    # does. Only after a green gate, as before. A failed push (a ruleset on
    # the branch) is a warning: the README then keeps showing the previous
    # state rather than a wrong one.
    - name: Publish the badges
      if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        ls .github/badges/*.json >/dev/null 2>&1 || { echo "::warning::The gate wrote no badge files - nothing to publish."; exit 0; }
        dir="$RUNNER_TEMP/badges"
        if git ls-remote --exit-code --heads origin badges >/dev/null; then
          git fetch -q --depth=1 origin badges
          git worktree add -q "$dir" FETCH_HEAD
          git -C "$dir" checkout -q -B badges
        else
          git worktree add -q --detach "$dir"
          git -C "$dir" switch -q --orphan badges
        fi
        cp .github/badges/*.json "$dir/"
        cd "$dir"
        git add -A
        if git diff --cached --quiet; then
          echo "The badges branch is up to date."
          exit 0
        fi
        git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
          commit -qm "Badges for ${GITHUB_SHA::7}"
        if git push -q origin badges; then
          echo "Badges published to the badges branch."
        else
          echo "::warning::The badges could not be pushed to the badges branch - the README keeps showing the previous state."
        fi
