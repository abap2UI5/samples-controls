name: abap-702

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abap-702-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-702:
    runs-on: ubuntu-latest
    # `npm run downport` is abaplint --fix iterating the downport rule to a
    # fixpoint over the whole corpus, each pass a full re-parse, and it grows
    # with every batch. It outgrew the 10 minutes this job used to allow some
    # time ago: EVERY run since then died in that step, so the badge read
    # "cancelled" for a timeout rather than for a v702 finding.
    #
    # Where 60 came from, at 416 ports: ~27 passes overall (the downport rule
    # alone ~44, definitions_top then settling one statement per pass over
    # 300+ more), measured as "well over half an hour".
    #
    # RE-DERIVED 2026-08-27 at 622 ports, because the pass counts above were
    # never re-measured and cannot be — nothing in the step prints them, so
    # the budget is derived from the step's own wall clock instead. Run
    # 33074679973 (main, c25a252, ubuntu-latest): `npm run downport` 36 m 50 s,
    # whole job 37 m 43 s. So 60 still holds, with ~22 minutes of headroom —
    # roughly another third of corpus growth at this rate. Re-derive the same
    # way (a green run's step timings), not from the 416-era pass counts.
    timeout-minutes: 60
    steps:
    # fetch-depth: 0 - the scope step below diffs against the base commit,
    # which a shallow checkout does not have.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # Half an hour to relint ABAP that did not change is half an hour a page,
    # a README or a sidecar change waits for nothing. scripts/abap-scope.mjs
    # decides from the changed files whether this gate's verdict can move at
    # all; a path it does not recognise counts as "can", so the failure mode
    # is a slow pull request rather than a gate that stopped gating. The job
    # itself always runs and always reports - branch protection tracks the
    # job name, and a required check that never reports blocks the merge.
    - name: Does this change reach the ABAP?
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
        if [ -n "${BASE_SHA:-}" ] && have "$BASE_SHA"; then
          files=$(git diff --name-only "$BASE_SHA...HEAD")
        elif [ -n "${BEFORE_SHA:-}" ] && have "$BEFORE_SHA"; then
          files=$(git diff --name-only "$BEFORE_SHA..HEAD")
        else
          files=''   # no range to work out - abap-scope.mjs answers "run"
        fi
        printf '%s\n' "$files" | node scripts/abap-scope.mjs | tee -a "$GITHUB_OUTPUT"

    - name: Nothing the 702 lint reads
      if: steps.scope.outputs.run != 'true'
      env:
        REASON: ${{ steps.scope.outputs.reason }}
      run: |
        echo "abap-702 skipped the downport — $REASON" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.scope.outputs.run == 'true'
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
      if: steps.scope.outputs.run == 'true'
    - run: npm run downport
      if: steps.scope.outputs.run == 'true'
    - run: npx abaplint .github/abaplint/abap_702.jsonc
      if: steps.scope.outputs.run == 'true'
