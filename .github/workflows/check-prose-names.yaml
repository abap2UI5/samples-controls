name: check-prose-names

# A class name written in prose is a class that exists - including when it
# lives in a sibling repository. The three sample READMEs carry the same
# learning-path table naming each other's overview apps, and when THIS
# repository renamed its overview to z2ui5_cl_smpc_app_000 the other two went
# on telling readers to run a class that no longer existed anywhere - which
# nothing over there could notice, because nothing over there reads this
# repository. The gate was written in samples and samples-stack after that,
# and reached the repository the incident started in last.
#
# Foreign sample names resolve through the owning repository's generated
# SAMPLES.md over raw.githubusercontent.com; framework names need the sources,
# so abap2UI5/src is sparse-checked-out next to this one. Without it the run
# SAYS which names it could not check rather than passing them silently.
#
# The script is byte-identical in samples, samples-controls and samples-stack;
# only scripts/prose-absent.json differs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-prose-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose_names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: abap2UI5/abap2UI5
        ref: main
        path: .abap2UI5
        fetch-depth: 1
        sparse-checkout: src
        sparse-checkout-cone-mode: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    # A runner cannot check a repository out above the workspace, so the
    # framework lands inside it and the variable says where - the same
    # env-over-sibling resolution abap2UI5/mcp-server uses.
    - run: node scripts/check-prose-names.mjs
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
